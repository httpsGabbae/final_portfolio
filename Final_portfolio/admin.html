<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./styles-2.css" />
<title>Inbox — Private</title>
<script>try{var t=localStorage.getItem("v2-theme");if(t==="light")document.documentElement.dataset.theme="light";}catch(e){}</script>
</head>
<body>
<div class="cursor-dot" aria-hidden="true"></div>

<main class="wrap admin">
  <p class="kicker"><b>···</b> — Private inbox</p>

  <p class="mono" id="authNote">Checking session…</p>

  <div id="inbox" hidden>
    <div class="dash">
      <aside class="side" aria-label="Inbox navigation">
        <div class="side-brand"><span class="side-logo">G</span><span><strong>Gabbae</strong><span class="mono">MESSAGE INBOX</span></span></div>
        <button type="button" class="side-link on" data-view="all"><span>Inbox</span><b id="navTotal">0</b></button>
        <button type="button" class="side-link" data-view="unread"><span>Unread</span><b id="navUnread">0</b></button>
        <button type="button" class="side-link" data-view="read"><span>Read</span><b id="navRead">0</b></button>
        <div class="side-foot">
          <span class="mono" id="sideUser">admin</span>
          <button type="button" id="logoutBtn">Log out</button>
        </div>
      </aside>

      <div class="dash-main">
        <div class="dash-head">
          <div><h1 class="admin-title">Dashboard</h1><p class="mono" id="dashDate">Welcome back! Here&apos;s what&apos;s happening today.</p></div>
          <button class="btn btn-sm" id="refreshBtn" type="button">Refresh</button>
        </div>

        <div class="stat-grid">
          <div class="stat"><span class="mono">Total Messages</span><strong id="statTotal">0</strong><span class="mono dim" id="statTotalSub">all time</span></div>
          <div class="stat"><span class="mono">Unread</span><strong id="statUnread">0</strong><span class="mono dim">needs a reply</span></div>
          <div class="stat"><span class="mono">This Week</span><strong id="statWeek">0</strong><span class="mono dim">last 7 days</span></div>
          <div class="stat"><span class="mono">Read Rate</span><strong id="statRate">0%</strong><span class="mono dim">handled</span></div>
        </div>

        <div class="dash-panels">
          <div class="panel">
            <div class="panel-head"><strong>Recent Activity</strong><span class="mono">latest first</span></div>
            <div id="activityRows" class="activity"></div>
          </div>
          <div class="panel">
            <div class="panel-head"><strong>Messages / Day</strong><span class="mono">last 7 days</span></div>
            <div class="bars" id="bars"></div>
            <div class="bars-x mono" id="barsX"></div>
          </div>
        </div>

        <div class="inbox-tools">
          <input id="searchInput" type="search" placeholder="Search name, email, or message…" aria-label="Search messages" />
          <span class="hero-row" style="gap:10px"><button class="btn btn-sm" id="readAllBtn" type="button">Mark all read</button></span>
        </div>
        <div id="msgList" class="msg-list"></div>
      </div>
    </div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  "use strict";
  var SUPABASE_URL = "https://sbqxizjtgdfixvnwtbry.supabase.co";
  var SUPABASE_KEY = "sb_publishable_jky21GxgSF35_XYQWRnnbw_na-NBhOW";
  var ADMIN_EMAIL = "gabbae.dev@gmail.com";
  var $ = function (s) { return document.querySelector(s); };
  var $$ = function (s) { return Array.prototype.slice.call(document.querySelectorAll(s)); };
  var inbox = $("#inbox"), list = $("#msgList");
  var allRows = [], view = "all";

  /* Cursor dot (same as main site; hidden on touch by CSS) */
  (function cursor() {
    if (!window.matchMedia("(hover: hover) and (pointer: fine)").matches) return;
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    var dot = document.querySelector(".cursor-dot");
    if (!dot) return;
    var t = 0;
    window.addEventListener("pointermove", function (e) {
      document.body.classList.add("cursor-on");
      document.body.classList.remove("cursor-idle");
      clearTimeout(t);
      t = setTimeout(function () { document.body.classList.add("cursor-idle"); }, 2500);
      dot.style.transform = "translate(" + e.clientX + "px," + e.clientY + "px) translate(-50%,-50%)";
    }, { passive: true });
  })();

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function ago(iso) {
    if (!iso) return "";
    var mins = Math.max(0, Math.round((Date.now() - new Date(iso).getTime()) / 60000));
    if (mins < 1) return "just now";
    if (mins < 60) return mins + "m ago";
    var hrs = Math.round(mins / 60);
    if (hrs < 24) return hrs + "h ago";
    var days = Math.round(hrs / 24);
    if (days < 14) return days + "d ago";
    return new Date(iso).toLocaleDateString("en-PH", { timeZone: "Asia/Manila" });
  }
  function friendlyError(msg) {
    if (/invalid login credentials/i.test(msg)) return "Wrong email or password. If you never made the account: Supabase → Authentication → Add user → gabbae.dev@gmail.com.";
    if (/email not confirmed/i.test(msg)) return "Account exists but isn't confirmed. In Supabase → Authentication → Users, tick Auto Confirm (or confirm the user).";
    if (/row-level security|permission|policy/i.test(msg)) return "Logged in, but the table rules block you. Run the messages-table SQL (with the Owner policies) in the NEW project.";
    if (/relation .* does not exist|table/i.test(msg)) return "The messages table doesn't exist yet. Run the setup SQL in Supabase → SQL Editor.";
    return msg;
  }

  function render() {
    var q = ($("#searchInput").value || "").toLowerCase();
    var rows = allRows.filter(function (m) {
      if (view === "unread" && m.is_read) return false;
      if (view === "read" && !m.is_read) return false;
      if (!q) return true;
      return (m.name + " " + m.email + " " + m.message).toLowerCase().indexOf(q) !== -1;
    });
    var unread = allRows.filter(function (m) { return !m.is_read; }).length;
    var read = allRows.length - unread;
    var week = allRows.filter(function (m) { return Date.now() - new Date(m.created_at).getTime() < 7 * 864e5; }).length;
    $("#statTotal").textContent = allRows.length;
    $("#statUnread").textContent = unread;
    $("#statWeek").textContent = week;
    $("#statRate").textContent = (allRows.length ? Math.round(read / allRows.length * 100) : 0) + "%";
    $("#navTotal").textContent = allRows.length;
    $("#navUnread").textContent = unread;
    $("#navRead").textContent = read;

    /* activity: latest 6 */
    $("#activityRows").innerHTML = allRows.slice(0, 6).map(function (m) {
      return '<div class="act-row"><span class="act-dot' + (m.is_read ? "" : " hot") + '"></span>' +
        '<span><strong>' + esc(m.name) + '</strong><span class="mono"> · ' + esc(m.message.slice(0, 42)) + (m.message.length > 42 ? "…" : "") + '</span></span>' +
        '<span class="mono">' + esc(ago(m.created_at)) + '</span></div>';
    }).join("") || '<p class="mono">No activity yet.</p>';

    /* chart: last 7 days */
    var days = [], counts = [];
    for (var i = 6; i >= 0; i--) {
      var d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() - i);
      days.push(d);
      var next = new Date(d).getTime() + 864e5;
      counts.push(allRows.filter(function (m) {
        var t = new Date(m.created_at).getTime();
        return t >= d.getTime() && t < next;
      }).length);
    }
    var max = Math.max.apply(null, counts.concat([1]));
    $("#bars").innerHTML = counts.map(function (c) {
      return '<span class="bar" style="height:' + Math.max(6, Math.round(c / max * 120)) + 'px" title="' + c + '"></span>';
    }).join("");
    $("#barsX").innerHTML = days.map(function (d) {
      return "<span>" + ["S", "M", "T", "W", "T", "F", "S"][d.getDay()] + "</span>";
    }).join("");

    list.innerHTML = rows.length ? rows.map(function (m) {
      var when = m.created_at ? new Date(m.created_at).toLocaleString("en-PH", { timeZone: "Asia/Manila" }) : "";
      return '<article class="msg-card' + (m.is_read ? "" : " unread") + '" data-id="' + m.id + '">' +
        '<div class="msg-top"><strong>' + esc(m.name) + '</strong>' +
        '<span class="mono">' + esc(ago(m.created_at)) + ' · ' + esc(when) + '</span></div>' +
        '<div class="mono msg-mail">' + esc(m.email) + '</div>' +
        '<p>' + esc(m.message) + '</p>' +
        '<div class="msg-actions">' +
        '<button type="button" data-act="read">' + (m.is_read ? "Mark unread" : "Mark read") + '</button>' +
        '<button type="button" data-act="reply">Reply</button>' +
        '<button type="button" data-act="del" class="danger">Delete</button>' +
        '</div></article>';
    }).join("") : '<p class="mono">Nothing here. Try a different search.</p>';
  }

  function load() {
    list.innerHTML = '<p class="mono">Loading…</p>';
    db.from("messages").select("*").order("created_at", { ascending: false }).then(function (res) {
      if (res.error) { list.innerHTML = '<p class="mono">Error: ' + esc(friendlyError(res.error.message)) + '</p>'; return; }
      allRows = res.data || [];
      render();
    });
  }

  var db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  list.addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-act]");
    if (!btn) return;
    var card = btn.closest(".msg-card");
    var id = Number(card.dataset.id);
    var act = btn.dataset.act;
    if (act === "reply") {
      var mail = card.querySelector(".msg-mail").textContent;
      window.location.href = "mailto:" + mail + "?subject=" + encodeURIComponent("Re: your portfolio message");
      return;
    }
    if (act === "del" && !confirm("Delete this message?")) return;
    var patch = act === "read"
      ? db.from("messages").select("is_read").eq("id", id).single().then(function (r) {
          if (r.error) throw r.error;
          return db.from("messages").update({ is_read: !r.data.is_read }).eq("id", id);
        })
      : db.from("messages").delete().eq("id", id);
    Promise.resolve(patch).then(function (res) {
      if (res && res.error) { alert(friendlyError(res.error.message)); return; }
      load();
    }).catch(function (err) { alert(friendlyError(err.message)); });
  });

  $$(".side-link").forEach(function (b) {
    b.addEventListener("click", function () {
      $$(".side-link").forEach(function (x) { x.classList.remove("on"); });
      b.classList.add("on");
      view = b.dataset.view;
      render();
    });
  });
  $("#searchInput").addEventListener("input", render);
  $("#readAllBtn").addEventListener("click", function () {
    var ids = allRows.filter(function (m) { return !m.is_read; }).map(function (m) { return m.id; });
    if (!ids.length) return;
    db.from("messages").update({ is_read: true }).in("id", ids).then(function (res) {
      if (res.error) { alert(friendlyError(res.error.message)); return; }
      load();
    });
  });
  $("#refreshBtn").addEventListener("click", load);
  $("#logoutBtn").addEventListener("click", function () {
    db.auth.signOut().then(function () {
      window.location.replace("./login.html");
    });
  });

  function enter() {
    var note = $("#authNote");
    if (note) note.hidden = true;
    $("#sideUser").textContent = ADMIN_EMAIL;
    try {
      $("#dashDate").textContent = "Welcome back! " + new Date().toLocaleDateString("en-PH", { weekday: "long", month: "long", day: "numeric", timeZone: "Asia/Manila" }) + ".";
    } catch (_) {}
    inbox.hidden = false;
    load();
  }

  db.auth.getSession().then(function (res) {
    var email = res.data.session && res.data.session.user && res.data.session.user.email;
    if (email && email.toLowerCase() === ADMIN_EMAIL) enter();
    else window.location.replace("./login.html");
  });
})();
</script>
</body>
</html>
