<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./styles.css" />
<title>Inbox — Private</title>
<script>try{var t=localStorage.getItem("v2-theme");if(t==="light")document.documentElement.dataset.theme="light";}catch(e){}</script>
</head>
<body>
<main class="wrap admin">
  <p class="kicker"><b>···</b> — Private inbox</p>
  <h1 class="admin-title">Messages</h1>

  <form class="contact-form admin-login" id="loginForm">
    <div><label class="mono" for="adminEmail">Admin email</label><input id="adminEmail" type="email" required autocomplete="username" placeholder="you@mail.com" /></div>
    <div><label class="mono" for="adminPass">Password</label><input id="adminPass" type="password" required autocomplete="current-password" placeholder="••••••••" /></div>
    <div class="hero-row"><button class="btn btn-solid" type="submit" id="loginBtn">Log in</button></div>
    <p class="form-ok" id="loginErr" hidden></p>
  </form>

  <div id="inbox" hidden>
    <div class="inbox-bar">
      <span class="mono" id="inboxCount"></span>
      <span class="hero-row" style="gap:10px">
        <button class="btn btn-sm" id="refreshBtn" type="button">Refresh</button>
        <button class="btn btn-sm" id="logoutBtn" type="button">Log out</button>
      </span>
    </div>
    <div id="msgList" class="msg-list"></div>
  </div>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  "use strict";
  var SUPABASE_URL = "https://sbqxizjtgdfixvnwtbry.supabase.co";
  var SUPABASE_KEY = "sb_publishable_jky21GxgSF35_XYQWRnnbw_na-NBhOW";
  var ADMIN_EMAIL = "gabbae.dev@gmail.com";
  var $ = function (s) { return document.querySelector(s); };
  var db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  var loginForm = $("#loginForm"), inbox = $("#inbox"), list = $("#msgList");

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function showErr(t) { var e = $("#loginErr"); e.textContent = t; e.hidden = false; }

  function render(rows) {
    $("#inboxCount").textContent = rows.length + (rows.length === 1 ? " message" : " messages") +
      (rows.length ? " · " + rows.filter(function (m) { return !m.is_read; }).length + " unread" : "");
    list.innerHTML = rows.length ? rows.map(function (m) {
      var when = m.created_at ? new Date(m.created_at).toLocaleString("en-PH", { timeZone: "Asia/Manila" }) : "";
      return '<article class="msg-card' + (m.is_read ? "" : " unread") + '" data-id="' + m.id + '">' +
        '<div class="msg-top"><strong>' + esc(m.name) + '</strong>' +
        '<span class="mono">' + esc(when) + '</span></div>' +
        '<div class="mono msg-mail">' + esc(m.email) + '</div>' +
        '<p>' + esc(m.message) + '</p>' +
        '<div class="msg-actions">' +
        '<button type="button" data-act="read">' + (m.is_read ? "Mark unread" : "Mark read") + '</button>' +
        '<button type="button" data-act="reply">Reply</button>' +
        '<button type="button" data-act="del" class="danger">Delete</button>' +
        '</div></article>';
    }).join("") : '<p class="mono">No messages yet.</p>';
  }

  function load() {
    list.innerHTML = '<p class="mono">Loading…</p>';
    db.from("messages").select("*").order("created_at", { ascending: false }).then(function (res) {
      if (res.error) { list.innerHTML = '<p class="mono">Error: ' + esc(res.error.message) + '</p>'; return; }
      render(res.data || []);
    });
  }

  list.addEventListener("click", function (e) {
    var btn = e.target.closest("button[data-act]");
    if (!btn) return;
    var card = btn.closest(".msg-card");
    var id = Number(card.dataset.id);
    var act = btn.dataset.act;
    if (act === "reply") {
      var mail = card.querySelector(".msg-mail").textContent;
      window.location.href = "mailto:" + mail + "?subject=" + encodeURIComponent("Re: your portfolio message");
      return;
    }
    if (act === "del" && !confirm("Delete this message?")) return;
    var patch = act === "read"
      ? db.from("messages").select("is_read").eq("id", id).single().then(function (r) {
          if (r.error) throw r.error;
          return db.from("messages").update({ is_read: !r.data.is_read }).eq("id", id);
        })
      : db.from("messages").delete().eq("id", id);
    Promise.resolve(patch).then(function (res) {
      if (res && res.error) { alert(res.error.message); return; }
      load();
    }).catch(function (err) { alert(err.message); });
  });

  $("#refreshBtn").addEventListener("click", load);
  $("#logoutBtn").addEventListener("click", function () {
    db.auth.signOut().then(function () {
      inbox.hidden = true; loginForm.hidden = false;
    });
  });

  loginForm.addEventListener("submit", function (e) {
    e.preventDefault();
    var btn = $("#loginBtn");
    btn.disabled = true; btn.textContent = "Logging in…";
    db.auth.signInWithPassword({ email: $("#adminEmail").value.trim(), password: $("#adminPass").value })
      .then(function (res) {
        if (res.error) { showErr(res.error.message); return; }
        if ((res.data.user && res.data.user.email || "").toLowerCase() !== ADMIN_EMAIL) {
          db.auth.signOut();
          showErr("This account is not the inbox owner.");
          return;
        }
        loginForm.hidden = true; inbox.hidden = false;
        load();
      })
      .catch(function (err) { showErr(err.message); })
      .then(function () { btn.disabled = false; btn.textContent = "Log in"; });
  });

  db.auth.getSession().then(function (res) {
    var email = res.data.session && res.data.session.user && res.data.session.user.email;
    if (email && email.toLowerCase() === ADMIN_EMAIL) {
      loginForm.hidden = true; inbox.hidden = false;
      load();
    }
  });
})();
</script>
</body>
</html>
